[[rule]]
toolName = "*"
decision = "deny"
priority = 100

[[rule]]
mcpName = "*"
decision = "deny"
priority = 200

[[rule]]
mcpName = "ros-mcp-imece"
toolName = [
  "connect_to_robot",
  "ping_robot",
  "detect_ros_version",
  "get_topics",
  "get_topic_type",
  "get_topic_details",
  "get_message_details",
  "subscribe_once",
  "subscribe_for_duration",
  "publish_once",
  "publish_for_durations",
  "get_services",
  "get_service_type",
  "get_service_details",
  "call_service",
  "setpoint_relay",
  "mode_guard"
]
decision = "allow"
priority = 900
